# Lint configuration.
#
# Chosen to catch defects without restyling. `bin/memory` is a single file of deliberately dense
# one-liners, so pycodestyle's E70x (several statements on one line) and the naming and
# complexity rules stay off. Everything selected below passes with no exceptions: syntax errors,
# pyflakes, bugbear, whitespace, the 160-column limit, ambiguous names, lambda assignment,
# pyupgrade, simplify, pylint errors and warnings, and ruff's own rules.
line-length = 160
extend-include = ["bin/memory"]

[lint]
select = ["E9", "F", "B", "W", "E501", "E731", "E741", "UP", "SIM", "PLE", "PLW", "RUF"]
