# Weekly updates for what the pins would otherwise leave to age: the commit-pinned actions, the hashed Python packages
# (the dev tools and the image's runtime) and the image's base. Each arrives as a pull request, and CI is the verdict
# on it like any other. A pip pull request changes requirements-*.txt only; its `.in` input is edited by hand
# (see the header of each lock file).
#
# The base image moves by patch only: CI covers Python 3.10 to 3.13 and the image targets 3.12, so a jump to another
# minor is for a person.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      python-packages:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: python
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
