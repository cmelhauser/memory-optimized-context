name: CI

# Three jobs, split by what they verify. A pull request runs all of them, so its result is the whole
# verdict: nothing has to be dispatched by hand, and the push of a tested commit to `main` runs nothing
# again (it is the same commit). `workflow_dispatch` is for a branch with no pull request.
#
# `lint` is its own job so a style failure reads as a style failure and reports in seconds. The ruleset
# catches defects rather than restyling code; ruff.toml lists the rules. The documentation check
# (tools/check_docs.py) runs inside pytest, so a stale count in the README fails the unit tests.
#
# `unit-tests` runs pytest on the floor the tool declares (3.10), the Python the Docker image runs (3.12) and
# the newest (3.13). 3.11 lies between two of them and has never failed alone. The coverage gate in .coveragerc
# is measured once, on 3.12: the code is the same on every version, and tracing slows the others.
#
# `container` builds the image and runs the CLI in it. A plain `docker build` is enough for one architecture;
# the release workflow builds both.

on:
  pull_request:            # any base branch, so a pull request stacked on another is checked too
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      # Only the linters; the floors are those in requirements-dev.txt. actionlint-py runs the shellcheck
      # that shellcheck-py puts on the PATH over every `run:` block, as the action it replaces did.
      - name: Install the linters
        run: python -m pip install "ruff>=0.6" "shellcheck-py>=0.10" "actionlint-py>=1.7"

      - name: Python lint
        run: ruff check --output-format=github .

      - name: Lint the workflows
        run: actionlint .github/workflows/*.yml

      - name: Lint the shell scripts
        run: shellcheck hooks/*.sh tools/*.sh

      # Compose refuses to start without .env, on purpose (no key means a native install; see
      # hooks/runner.sh), so the file is validated against the example.
      - name: Compose file is valid
        run: cp .env.example .env && HOME=/tmp docker compose config -q

  unit-tests:
    name: Unit tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      # Also runs tools/check_docs.py: counts stated in prose, the version, every relative link, the
      # coverage gate, and the absence of any home path or email address, all re-derived from the tree.
      - name: Unit tests, with the coverage gate on bin/memory
        if: matrix.python-version == '3.12'
        run: python -m pytest --cov --cov-report=term-missing

      - name: Unit tests
        if: matrix.python-version != '3.12'
        run: python -m pytest

  container:
    name: Container image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Build
        run: docker build -t memory-optimized-context:ci .

      - name: The image runs the CLI
        run: |
          docker run --rm -e MEMORY_ROOT=/tmp/m -e MEMORY_DB=/tmp/m/memory.db -e MEMORY_LLM=none \
            --entrypoint python3 memory-optimized-context:ci /app/memory compile
