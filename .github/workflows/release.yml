name: Release

# Runs when a version tag is pushed. A tag is a claim that the release conditions in
# RELEASING.md held at that commit; this workflow records publicly whether the claim held and,
# if it did, publishes the container image to GitHub Container Registry under the tag.
#
# It cannot make a bad tag good. It re-runs ruff, shellcheck and the test matrix (CI's), requires the tag to
# be annotated, and only then builds and pushes the multi-architecture image.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Only the publish job may write packages: `verify` installs and runs third-party tools, and a compromised
# release of one of them must not find a token that can push the image.
permissions:
  contents: read

jobs:
  verify:
    name: Verify the tagged tree
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install --require-hashes -r requirements-dev.txt

      - name: Lint
        run: |
          ruff check .
          shellcheck hooks/*.sh tools/*.sh

      - name: Unit tests with the coverage gate
        run: python -m pytest --cov

      # Fetch the tag object explicitly rather than trusting the checkout to have it; a shallow
      # or partial checkout resolves an annotated tag to its commit and the check below then
      # fails on a tag that is in fact correct.
      # A tag anyone with write access can push would otherwise publish whatever commit it points at.
      - name: The tagged commit must be on main
        if: matrix.python-version == '3.12' && github.ref_type == 'tag'
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::${GITHUB_REF_NAME} is not on main; releases are cut from main"; exit 1; }

      - name: The tag must be annotated and name the version
        if: matrix.python-version == '3.12' && github.ref_type == 'tag'
        run: |
          set -euo pipefail
          git fetch --force --no-tags origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          kind="$(git for-each-ref "refs/tags/${GITHUB_REF_NAME}" --format='%(objecttype)')"
          if [ "$kind" != "tag" ]; then
            echo "::error::${GITHUB_REF_NAME} is a lightweight tag; releases must be annotated"
            exit 1
          fi
          message="$(git for-each-ref "refs/tags/${GITHUB_REF_NAME}" --format='%(contents)')"
          [ -n "$message" ] || { echo "::error::empty tag message"; exit 1; }
          cff="$(grep -E '^version:' CITATION.cff | sed -E 's/version: *"?([^"]+)"?/\1/')"
          if [ "v${cff}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::CITATION.cff says ${cff} but the tag is ${GITHUB_REF_NAME}"
            exit 1
          fi
          grep -q "^## \[${cff}\]" CHANGELOG.md || { echo "::error::CHANGELOG.md has no ## [${cff}] section"; exit 1; }

  publish:
    name: Publish the container image
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.ref_type == 'tag'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push arm64 and amd64
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          platforms: linux/arm64,linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ${{ !contains(github.ref_name, '-') && format('ghcr.io/{0}:latest', github.repository) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
