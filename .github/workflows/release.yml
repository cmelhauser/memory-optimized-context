name: Release

# Runs when a version tag is pushed. A tag is a claim that the release conditions in
# RELEASING.md held at that commit; this workflow records publicly whether the claim held and,
# if it did, publishes the container image to GitHub Container Registry under the tag.
#
# It cannot make a bad tag good. It re-runs lint and the full test matrix, requires the tag to
# be annotated, and only then builds and pushes the multi-architecture image.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  verify:
    name: Verify the tagged tree
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Lint
        run: |
          ruff check .
          shellcheck hooks/*.sh tools/*.sh

      - name: Unit tests with the coverage gate
        run: python -m pytest --cov

      # Fetch the tag object explicitly rather than trusting the checkout to have it; a shallow
      # or partial checkout resolves an annotated tag to its commit and the check below then
      # fails on a tag that is in fact correct.
      - name: The tag must be annotated and name the version
        if: matrix.python-version == '3.12' && github.ref_type == 'tag'
        run: |
          set -euo pipefail
          git fetch --force --no-tags origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          kind="$(git for-each-ref "refs/tags/${GITHUB_REF_NAME}" --format='%(objecttype)')"
          if [ "$kind" != "tag" ]; then
            echo "::error::${GITHUB_REF_NAME} is a lightweight tag; releases must be annotated"
            exit 1
          fi
          message="$(git for-each-ref "refs/tags/${GITHUB_REF_NAME}" --format='%(contents)')"
          [ -n "$message" ] || { echo "::error::empty tag message"; exit 1; }
          cff="$(grep -E '^version:' CITATION.cff | sed -E 's/version: *"?([^"]+)"?/\1/')"
          if [ "v${cff}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::CITATION.cff says ${cff} but the tag is ${GITHUB_REF_NAME}"
            exit 1
          fi
          grep -q "^## \[${cff}\]" CHANGELOG.md || { echo "::error::CHANGELOG.md has no ## [${cff}] section"; exit 1; }

  publish:
    name: Publish the container image
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.ref_type == 'tag'
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push arm64 and amd64
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64,linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
