name: Bug report
description: Something the tool does that its README or tests say it should not
body:
  - type: markdown
    attributes:
      value: |
        Do not paste lessons, transcripts, exports or the contents of `~/memory`: they are someone's conversations.
        Invented text that shows the problem is enough. For a security problem, use the private route in SECURITY.md.
  - type: input
    id: version
    attributes:
      label: Version
      description: The release tag (`git describe --tags` in your checkout) or the image tag
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: Install
      options: [Native, Docker, Not sure]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Relevant lines from hook.log or the command's output
      description: Remove anything private first.
      render: text
